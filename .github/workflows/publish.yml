name: Publish packages to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - aeterna-config-yaml
          - aeterna-config
          - aeterna-di
          - aeterna-runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel "packages/${{ matrix.package }}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }} to PyPI
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aeterna-config-yaml
            environment: pypi_aeterna-config-yaml
          - package: aeterna-config
            environment: pypi_aeterna-config
          - package: aeterna-di
            environment: pypi_aeterna-di
          - package: aeterna-runtime
            environment: pypi_aeterna-runtime

    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-${{ matrix.package }}
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
