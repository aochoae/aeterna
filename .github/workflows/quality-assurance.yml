name: Quality Assurance

on:
  push:
    branches:
      - main
      - release/*
      - develop
      - feature/*
      - bugfix/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - release/*
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.12.5"
          uv sync --locked

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.12.5"
          uv sync --locked

      - name: Run coverage
        run: |
          uv run pytest --cov=aeterna --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5.0.0
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: coverage-report
          path: .
      - name: Verify coverage report
        run: test -s coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_packages:
    name: Build ${{ matrix.package }}
    needs:
      - test
      - coverage
      - dependency_audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aeterna
          - package: aeterna-di
          - package: aeterna-config
          - package: aeterna-config-yaml
          - package: aeterna-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.12.5"
          uv sync --locked

      - name: Build distribution package
        run: |
          uv run python -m build --sdist --wheel "packages/${{ matrix.package }}"

      - name: Upload built package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v5.0.0
        with:
          name: dist-${{ matrix.package }}
          path: "packages/${{ matrix.package }}/dist"
          if-no-files-found: error
          retention-days: 7

  # Validate each release distribution after the package builds complete.
  smoke_test:
    name: Smoke test ${{ matrix.package }}
    needs: build_packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aeterna
          - package: aeterna-di
          - package: aeterna-config
          - package: aeterna-config-yaml
          - package: aeterna-runtime

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Install built wheel and source distribution in fresh environments
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          import textwrap
          import venv
          from pathlib import Path

          package = "${{ matrix.package }}"
          artifacts = Path("dist-artifacts")
          wheels = sorted(artifacts.glob(f"{package.replace('-', '_')}-*.whl"))
          sdists = sorted(artifacts.glob(f"{package.replace('-', '_')}-*.tar.gz"))
          packages = (
              "aeterna",
              "aeterna-config",
              "aeterna-config-yaml",
              "aeterna-di",
              "aeterna-runtime",
          )
          sibling_wheels = {
              name: matches[0]
              for name in packages
              if len(matches := list(artifacts.glob(f"{name.replace('-', '_')}-*.whl"))) == 1
          }

          # Fail on missing or ambiguous artifacts instead of testing an arbitrary build.
          if len(wheels) != 1 or len(sdists) != 1 or len(sibling_wheels) != len(packages):
              names = ", ".join(item.name for item in [*wheels, *sdists])
              raise SystemExit(
                  f"Expected one wheel and one sdist for {package}; found: {names or 'none'}"
              )

          # Run metadata, import, and PEP 561 checks inside each fresh environment.
          checks = textwrap.dedent('''
          import importlib
          import importlib.util
          from importlib.metadata import version
          from pathlib import Path

          package = __PACKAGE__
          print(version(package))

          if package == "aeterna":
              for module in (
                  "aeterna.config",
                  "aeterna.config_yaml",
                  "aeterna.di",
                  "aeterna.runtime",
              ):
                  importlib.import_module(module)
              raise SystemExit(0)

          module = "aeterna." + package.removeprefix("aeterna-").replace("-", "_")
          spec = importlib.util.find_spec(module)
          if spec is None or not spec.origin:
              raise SystemExit(f"Could not locate installed module {module}")
          marker = Path(spec.origin).parent / "py.typed"
          if not marker.is_file():
              raise SystemExit(f"Installed distribution for {package} is missing {marker}")
          importlib.import_module(module)
          ''').replace("__PACKAGE__", repr(package))

          # Test both distribution formats independently to catch packaging-only defects.
          for artifact in [wheels[0], sdists[0]]:
              with tempfile.TemporaryDirectory() as directory:
                  environment = Path(directory) / "environment"
                  venv.EnvBuilder(with_pip=True).create(environment)
                  python = environment / "bin" / "python"
                  constraints = Path(directory) / "aeterna-artifacts.txt"
                  constraints.write_text(
                      "\n".join(
                          f"{name} @ {wheel.resolve().as_uri()}"
                          for name, wheel in sibling_wheels.items()
                          if name != package
                      )
                  )
                  subprocess.check_call([
                      python,
                      "-m",
                      "pip",
                      "install",
                      "--constraint",
                      str(constraints),
                      "--find-links",
                      str(artifacts),
                      str(artifact),
                  ])
                  subprocess.check_call([python, "-c", checks])
                  print(f"validated {artifact.name}")
          PY

  dependency_audit:
    name: Dependency advisory audit
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.12.5"
          uv sync --locked
      - name: Check installed dependencies for known advisories
        run: |
          uv tool run --from "pip-audit==2.10.0" pip-audit --strict
