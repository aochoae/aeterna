name: Quality Assurance

on:
  push:
    branches:
      - develop
      - feature/*
      - bugfix/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Run coverage
        run: >
          uv run pytest --cov=aeterna --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: .
      - name: Verify coverage report
        run: test -s coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_packages:
    name: Build ${{ matrix.package }}
    needs:
      - test
      - coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aeterna-di
          - package: aeterna-config
          - package: aeterna-config-yaml
          - package: aeterna-runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Build distribution package
        run: |
          uv run python -m build --sdist --wheel "packages/${{ matrix.package }}"

      - name: Upload built package artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.package }}
          path: "packages/${{ matrix.package }}/dist"
          if-no-files-found: error
          retention-days: 7

  smoke_test:
    name: Smoke test ${{ matrix.package }}
    needs: build_packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aeterna-di
          - package: aeterna-config
          - package: aeterna-config-yaml
          - package: aeterna-runtime

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download built artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Install built wheel and verify metadata
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import importlib.util
          import subprocess
          import sys
          from importlib.metadata import version
          from pathlib import Path

          package = "${{ matrix.package }}"
          artifacts = Path("dist-artifacts")
          wheels = sorted(artifacts.glob(f"{package.replace('-', '_')}-*.whl"))

          if not wheels:
              raise SystemExit(f"No wheel artifact for {package} found in {artifacts}")
          if len(wheels) > 1:
              # Ambiguity here silently smoke-tests an arbitrary build.
              names = ", ".join(w.name for w in wheels)
              raise SystemExit(f"Expected exactly one {package} wheel, found: {names}")

          subprocess.check_call([
              sys.executable, "-m", "pip", "install", "--force-reinstall",
              "--find-links", str(artifacts), str(wheels[0]),
          ])
          print(version(package))

          # PEP 561: the installed package must carry a py.typed marker, otherwise
          # downstream type checkers silently treat every aeterna import as Any.
          module = "aeterna." + package.removeprefix("aeterna-").replace("-", "_")
          spec = importlib.util.find_spec(module)
          if spec is None or not spec.origin:
              raise SystemExit(f"Could not locate installed module {module}")

          marker = Path(spec.origin).parent / "py.typed"
          if not marker.is_file():
              raise SystemExit(f"Installed wheel for {package} is missing {marker}")
          print(f"py.typed present for {module}")

          importlib.import_module(module)
          print(f"{module} imports cleanly")
          PY
