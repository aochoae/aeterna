[project]
name = "aeterna-config-yaml"
version = "1.0.0.dev2"
description = "YAML configuration provider for aeterna"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aeterna-config>=1.0.0.dev2,<2", "PyYAML>=6.0"]
authors = [{ name = "Alberto Ochoa" }]
maintainers = [{ name = "Alberto Ochoa" }]
keywords = ["yaml", "configuration", "provider", "aeterna"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aochoae/aeterna"
Repository = "https://github.com/aochoae/aeterna"
Documentation = "https://github.com/aochoae/aeterna/tree/main/docs"
Issues = "https://github.com/aochoae/aeterna/issues"

[tool.uv.sources]
aeterna-config = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeterna"]
