[project]
name = "aeterna-di"
version = "1.0.0.dev1"
description = "Explicit async dependency injection for aeterna"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "aeterna Contributors" }]
maintainers = [{ name = "aeterna Maintainers" }]
keywords = ["dependency injection", "async", "framework", "aeterna"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aochoae/aeterna"
Repository = "https://github.com/aochoae/aeterna"
Documentation = "https://github.com/aochoae/aeterna/tree/main/docs"
Issues = "https://github.com/aochoae/aeterna/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeterna"]
