[project]
name = "aeterna"
version = "1.0.0.dev1"
description = "Convenience distribution for the Aeterna framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aeterna-config>=1.0.0.dev1,<2",
  "aeterna-config-yaml>=1.0.0.dev1,<2",
  "aeterna-di>=1.0.0.dev1,<2",
  "aeterna-runtime>=1.0.0.dev1,<2",
]
authors = [{ name = "Alberto Ochoa" }]
maintainers = [{ name = "Alberto Ochoa" }]
keywords = ["async", "configuration", "dependency injection", "framework", "aeterna"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aochoae/aeterna"
Repository = "https://github.com/aochoae/aeterna"
Documentation = "https://github.com/aochoae/aeterna/tree/main/docs"
Issues = "https://github.com/aochoae/aeterna/issues"

[tool.uv.sources]
aeterna-config = { workspace = true }
aeterna-config-yaml = { workspace = true }
aeterna-di = { workspace = true }
aeterna-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeterna"]
